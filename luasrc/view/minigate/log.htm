<%+header%>
<%+minigate/style%>
<style>
.mgx-log-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.mgx-log{margin:0;max-height:600px;overflow-y:auto;padding:15px;border-radius:8px;border:1px solid var(--mgx-border);background:var(--mgx-log-bg);color:var(--mgx-log-text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
</style>
<h2>MiniGate - 日志</h2>
<div class="mgx-log-tools">
<label for="ls">来源</label>
<select id="ls" class="mgx-select" style="min-width:140px">
<option value="all">全部（按时间合并）</option><option value="ddns">DDNS</option><option value="acme">证书</option><option value="proxy">反向代理</option><option value="login_guard">登录防护</option><option value="update">软件更新</option>
</select>
<button type="button" class="cbi-button cbi-button-action" onclick="rl(true)">刷新</button>
<label><input type="checkbox" id="ar" checked> 自动刷新（5 秒）</label>
<span id="lh" class="mgx-small mgx-muted" role="status"></span>
</div>
<pre id="lc" class="mgx-log">加载中...</pre>
<script type="text/javascript">
var lt,loading=false;
var lu='<%=luci.dispatcher.build_url("admin/services/minigate/get_log")%>';
// 只有本来就停在底部时才跟随新日志；往上翻看旧内容时不被拉回
function atBottom(c){return c.scrollHeight-c.scrollTop-c.clientHeight<24}
function rl(jump){
    if(loading)return;
    loading=true;
    var s=document.getElementById('ls').value,c=document.getElementById('lc'),follow=jump||atBottom(c),done=false;
    function finish(x,d){
        if(done)return;done=true;loading=false;
        if(d&&typeof d.log==='string'){
            var top=c.scrollTop;
            c.textContent=d.log||'（暂无）';
            c.scrollTop=follow?c.scrollHeight:top;
            document.getElementById('lh').textContent=follow?'':'已暂停跟随最新日志，滚动到底部恢复';
        }else c.textContent='（无法读取）';
    }
    var p=XHR.get(lu,{source:s},finish);
    if(p&&typeof p.catch==='function')p.catch(function(){finish(null,null)});
}
function sa(){if(lt)clearInterval(lt);if(document.getElementById('ar').checked)lt=setInterval(function(){if(!document.hidden)rl(false)},5000)}
document.getElementById('ar').addEventListener('change',sa);
document.getElementById('lc').addEventListener('scroll',function(){if(atBottom(this))document.getElementById('lh').textContent=''});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&document.getElementById('ar').checked)rl(false)});
document.getElementById('ls').addEventListener('change',function(){rl(true)});
rl(true);sa();
</script>
<%+footer%>
