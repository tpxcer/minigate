name: Build and publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minigate-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          version=$(sed -n 's/^PKG_VERSION="\([^"]*\)"/\1/p' scripts/build-ipk.sh)
          make_version=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
          updater_version=$(sed -n 's/^CURRENT_VERSION="\([^"]*\)"/\1/p' root/usr/lib/minigate/update.sh)
          if [ -z "$version" ] || [ "$version" != "$make_version" ] || [ "$version" != "$updater_version" ]; then
            echo "Package and updater versions must match" >&2
            exit 1
          fi

          release_date=$(TZ=Asia/Shanghai date +'%Y.%-m.%-d')
          suffix=${version#"${release_date}-"}
          if [[ "$version" != "$release_date" ]] && ! { [[ "$version" == "$release_date-"* ]] && [[ "$suffix" =~ ^[1-9][0-9]*$ ]]; }; then
            echo "Version must use today's Asia/Shanghai date: ${release_date} or ${release_date}-N" >&2
            exit 1
          fi

          tag="v${version}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tag_commit=$(git rev-list -n 1 "$tag")
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Existing tag ${tag} points to another commit" >&2
              exit 1
            fi
          else
            if git show-ref --verify --quiet "refs/tags/v${release_date}"; then
              next=1
              for existing in $(git tag -l "v${release_date}-*"); do
                suffix=${existing#v${release_date}-}
                if [[ "$suffix" =~ ^[1-9][0-9]*$ ]] && (( suffix >= next )); then
                  next=$((suffix + 1))
                fi
              done
              expected="${release_date}-${next}"
            else
              expected="$release_date"
            fi
            if [ "$version" != "$expected" ]; then
              echo "Next release version must be ${expected}" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          test -s "releases/${tag}.md"

      - name: Test updater and online installer
        run: node --test tests/install.test.cjs tests/update.test.cjs

      - name: Build IPK
        shell: bash
        run: |
          chmod +x scripts/build-ipk.sh
          scripts/build-ipk.sh "$PWD/dist"

      - name: Build source archive
        shell: bash
        run: |
          git archive --format=tar.gz HEAD > "dist/minigate-v${{ steps.meta.outputs.version }}-src.tar.gz"
          cp "dist/minigate-v${{ steps.meta.outputs.version }}-src.tar.gz" \
            "dist/luci-app-minigate-v${{ steps.meta.outputs.version }}-src.tar.gz"
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; publish a new date sequence instead of replacing it" >&2
            exit 1
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "minigate v${VERSION}" --notes-file "releases/${TAG}.md" --latest
          fi
